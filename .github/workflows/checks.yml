# Selfcheck CI: every module's offline logic check, on every push (docs/04 §7, scoped
# down — the replay harness can't run here because the voice WAVs are deliberately
# untracked; see STATE, Track G). No models, no API key, no audio device needed.
name: checks

on:
  push:
  pull_request:

jobs:
  selfchecks:
    runs-on: windows-latest # the reference platform (spec/00 D10)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m bridge.config
      - run: python -m bridge.log
      # The config file + the settings schema it derives its defaults from (D28/D29). Points at
      # a temp file, so it never touches a real profile.
      - run: python -m bridge.settings
      - run: python -m bridge.audio.wake --selfcheck
      - run: python -m bridge.audio.listen --selfcheck
      - run: python -m bridge.audio.speak --selfcheck
      # Contract B core: the `transform` verb's plumbing over converse (no network). Run via -c,
      # not -m: the package __init__ already imports base, so -m re-executes it with a warning.
      - run: python -c "from bridge.brains import base; base._selfcheck()"
      - run: python -m bridge.brains.claude --selfcheck
      # The provider catalogue (D30): base-URL composition and the credential/env fallback, both
      # read from spec/schemas/settings.json. Touches the network only to prove a dead endpoint
      # returns [] instead of raising.
      - run: python -m bridge.brains.providers
      # B2 (D30): the one OpenAI-compatible adapter behind ten providers. Offline — request
      # shaping, tool translation, error mapping, client lifetime. No key, no network.
      - run: python -m bridge.brains.compat --selfcheck
      # The router (spec/20 §Routing, D33): resolve a role -> the configured provider/model from
      # settings, or None to let the caller default. No network — this is what makes the model
      # picker actually drive the daemon.
      - run: python -m bridge.brains.router
      - run: python -m bridge.orchestrator --selfcheck
      - run: python -m bridge.broadcaster --selfcheck
      # Parsing + the tap/hold machine only; RegisterHotKey itself is proven live on the box.
      - run: python -m bridge.hotkeys --selfcheck
      # Dictation delivery (spec/60): the UTF-16 encoder + a clipboard round-trip when the session
      # has one (skipped, not failed, in a headless runner); the Ctrl+V chord is proven live.
      - run: python -m bridge.paste --selfcheck
      # D15 word-replacement (spec/60): the whole-word, case-insensitive, literal find-and-replace
      # run before dictation cleanup, plus that the shipped table loads. No network.
      - run: python -m bridge.replace
      # Contract T (spec/30): the Tier-1 tool executor — the filter (only implemented, in-tier
      # tools reach the brain), dispatch, the refusal backstop, and that every call is audited to
      # logs/audit.jsonl. No network; degrades gracefully with no clipboard on a headless runner.
      # find_document included: the term sanitiser (its SQL trust boundary) is checked directly,
      # and the call itself must answer in prose whether or not the runner has a Search index.
      - run: python -m bridge.tools --selfcheck
      # The Teleprompter's Qt-free half: NDJSON framing + the reducer (imports no Qt).
      - run: python -m teleprompter.decode --selfcheck
      # The renderer itself. PySide6 is a CORE dependency (D23), so `pip install -e .` above
      # already installed it; overlay_check runs headless on Qt's offscreen platform (it sets
      # QT_QPA_PLATFORM itself), so no display is needed. This is the check guarding the module
      # where every renderer bug this cycle lived (X-01). Software RHI: no GPU on the runner.
      - run: python -m teleprompter.overlay_check
        env:
          QSG_RHI_BACKEND: software
      # The settings window's model — add/remove/enable/primary bookkeeping, no QML needed.
      - run: python -m teleprompter.settings_model
      # The Gem mascot renderer (Track P): frames load, the body-flip palette keeps the accents,
      # the app icon builds, image://gem tolerates a bad id, and the feed->Gem state map never
      # KeyErrors. Renders on Qt's offscreen platform (the module sets it itself).
      - run: python -m teleprompter.gem
      # ...and the window itself (D29), driven through every state it has. QML binding errors
      # are only warnings at runtime, so this fails on any of them. Headless, same as above.
      - run: python -m teleprompter.settings_check
        env:
          QSG_RHI_BACKEND: software
