# Selfcheck CI: every module's offline logic check, on every push (docs/04 §7, scoped
# down — the replay harness can't run here because the voice WAVs are deliberately
# untracked; see STATE, Track G). No models, no API key, no audio device needed.
name: checks

on:
  push:
  pull_request:

jobs:
  selfchecks:
    runs-on: windows-latest # the reference platform (spec/00 D10)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m bridge.config
      - run: python -m bridge.log
      - run: python -m bridge.audio.wake --selfcheck
      - run: python -m bridge.audio.listen --selfcheck
      - run: python -m bridge.audio.speak --selfcheck
      - run: python -m bridge.brains.claude --selfcheck
      - run: python -m bridge.orchestrator --selfcheck
      - run: python -m bridge.broadcaster --selfcheck
      # Parsing + the tap/hold machine only; RegisterHotKey itself is proven live on the box.
      - run: python -m bridge.hotkeys --selfcheck
      # The Teleprompter's Qt-free half: NDJSON framing + the reducer (imports no Qt).
      - run: python -m teleprompter.decode --selfcheck
      # The renderer itself. PySide6 is a CORE dependency (D23), so `pip install -e .` above
      # already installed it; overlay_check runs headless on Qt's offscreen platform (it sets
      # QT_QPA_PLATFORM itself), so no display is needed. This is the check guarding the module
      # where every renderer bug this cycle lived (X-01). Software RHI: no GPU on the runner.
      - run: python -m teleprompter.overlay_check
        env:
          QSG_RHI_BACKEND: software
