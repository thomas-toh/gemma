[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-bridge"
version = "0.0.0"
description = "Bridge daemon for Project Gemma (headset <-> LLM brains). See spec/ and docs/04."
requires-python = ">=3.11"
# ponytail: only what the code imports today. Audio/VAD/whisper/TTS deps land
# when steps 2-5 (docs/04 §8) actually need them, not speculatively.
dependencies = [
    "anthropic",
    "keyring",
]

[tool.setuptools]
packages = ["bridge"]
