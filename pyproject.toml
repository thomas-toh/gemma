[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-bridge"
version = "0.0.0"
description = "Bridge daemon for Project Gemma (headset <-> LLM brains). See spec/ and docs/04."
requires-python = ">=3.12"
# ponytail: only what the code imports today. TTS deps land when step 4 (docs/04
# §8) needs them, not speculatively.
dependencies = [
    "anthropic",
    "keyring",
    # step 2 (docs/04 §8): mic capture + wake word. onnxruntime is explicit because
    # we run openWakeWord on ONNX (Windows + macOS both, spec/00 D10), not tflite.
    "sounddevice",
    "openwakeword",
    "onnxruntime",
    # step 3: STT. VAD needs no new dep -- we run the Silero VAD ONNX model that
    # openWakeWord already ships, via onnxruntime (no torch; see bridge/audio/listen.py).
    "faster-whisper",
    # step 4: TTS out. Kokoro on onnxruntime (no torch); espeakng-loader (pulled in)
    # bundles the espeak-ng phonemiser, so no manual install. Earcons need no dep.
    "kokoro-onnx",
]

[project.optional-dependencies]
# GPU speech-to-text on an NVIDIA host (Windows/Linux): ~28x faster than CPU (STATE).
# Install with:  pip install -e ".[gpu-cuda]"  -- listen.py then adds these DLLs to the
# search path automatically. Not for macOS (use the CPU path / a future Metal engine).
gpu-cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12", "nvidia-cuda-runtime-cu12"]
# The Teleprompter front-end (component P, Track P). Optional by design: the daemon is
# headless and runs fine without it -- it just broadcasts to nobody. Needs Windows Long
# Paths enabled; Qt's QML module trees nest past 260 chars and the install silently
# half-completes without it (NOTES.md).
ui = ["PySide6"]

[tool.setuptools]
packages = ["bridge", "teleprompter"]

# The QML and the bundled font are loaded from disk relative to the package, so a non-editable
# install has to carry them too.
[tool.setuptools.package-data]
teleprompter = ["*.qml", "fonts/*.ttf"]
